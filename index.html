      --ink-muted:#B6B5B1;
      --ink-faint:#87867F;
      --rule:#343432;
      --rule-strong:#454541;
      --heading:#9FB6BD;

      --burgundy:#C1465A;
      --burgundy-soft:#3A2024;
      --plum:#6E6280;
      --plum-soft:#2C2836;
      --slate:#516470;
      --slate-soft:#212B2E;
      --rose:#93465A;
      --rose-soft:#392228;
      --mist:#436268;
      --mist-soft:#1E2A2C;
      --charcoal:#4E4E4B;
      --charcoal-soft:#272725;
      --ash:#6E6E68;
      --ash-soft:#232321;
      --jet:#3C3C3A;
      --jet-soft:#252524;

      --nav-bg:#3D3D3B;
      --hero-grad: linear-gradient(135deg,#0A0B0B,#252D30);
      --focus:#F2F1EE;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -8px rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="dark"]{
    --paper:#151515;
    --paper-raised:#1F1F1E;
    --paper-sunken:#0E0E0D;
    --ink:#F2F1EE;
    --ink-muted:#B6B5B1;
    --ink-faint:#87867F;
    --rule:#343432;
    --rule-strong:#454541;
    --heading:#9FB6BD;

    --burgundy:#C1465A;
    --burgundy-soft:#3A2024;
    --plum:#6E6280;
    --plum-soft:#2C2836;
    --slate:#516470;
    --slate-soft:#212B2E;
    --rose:#93465A;
    --rose-soft:#392228;
    --mist:#436268;
    --mist-soft:#1E2A2C;
    --charcoal:#4E4E4B;
    --charcoal-soft:#272725;
    --ash:#6E6E68;
    --ash-soft:#232321;
    --jet:#3C3C3A;
    --jet-soft:#252524;

    --nav-bg:#3D3D3B;
    --hero-grad: linear-gradient(135deg,#0A0B0B,#252D30);
    --focus:#F2F1EE;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -8px rgba(0,0,0,0.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Barlow', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:16px;
    line-height:1.55;
  }
  ::selection{background:var(--burgundy-soft); color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-feature-settings:'tnum' 1; font-variant-numeric:tabular-nums;}
  .display{font-family:'Barlow Condensed', ui-sans-serif, system-ui, sans-serif;}

  img{max-width:100%;}
  [hidden]{display:none!important;}

  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:30;
  }
  .masthead{
    padding:20px 18px 16px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    background:var(--hero-grad);
    position:relative;
    overflow:hidden;
  }
  .masthead::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 34px);
    pointer-events:none;
  }
  .wordmark{
    display:flex; flex-direction:column; gap:3px;
    position:relative;
  }
  .wordmark .tag{
    font-family:'Barlow', sans-serif;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#D98A96;
    font-weight:700;
  }
  .wordmark h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    text-transform:uppercase;
    font-size:30px;
    margin:0;
    letter-spacing:.01em;
    line-height:1;
    color:#FFFFFF;
    text-wrap:balance;
  }
  .wordmark .sub{
    font-size:12.5px;
    color:#C7CDCF;
    margin-top:2px;
    font-weight:500;
  }
  .theme-toggle{
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(255,255,255,0.08);
    border-radius:var(--radius-sm);
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:#fff;
    flex:none;
    position:relative;
  }
  .theme-toggle svg{width:16px;height:16px;}

  nav.tabs{
    display:flex;
    background:var(--nav-bg);
    overflow-x:auto;
  }
  nav.tabs button{
    border:none;background:none;
    padding:13px 15px;
    font-family:'Barlow Condensed', sans-serif;
    font-size:14.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:rgba(255,255,255,0.82);
    cursor:pointer;
    white-space:nowrap;
  }
  nav.tabs button.active{
    color:var(--ink);
    background:var(--paper);
    border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  }
  nav.tabs button .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    margin-left:3px;
    font-weight:500;
    letter-spacing:0;
    text-transform:none;
    opacity:.85;
  }

  /* ---------- Controls (schedule view) ---------- */
  .controls{
    padding:14px 14px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    border-bottom:1px solid var(--rule);
    background:var(--paper);
  }
  .daybar{
    display:flex;
    background:var(--paper-sunken);
    padding:0;
    gap:1px;
    border:1px solid var(--rule);
    border-radius:var(--radius-md);
    overflow:hidden;
  }
  .daybar button{
    flex:1;
    border:none;
    background:var(--paper-raised);
    padding:10px 6px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    letter-spacing:.03em;
    font-size:14.5px;
    text-transform:uppercase;
    color:var(--ink-muted);
    cursor:pointer;
    text-align:center;
    line-height:1.25;
  }
  .daybar button .d{display:block; font-size:11px; font-weight:500; opacity:.75; text-transform:none; font-family:'Barlow',sans-serif; letter-spacing:0;}
  .daybar button.active{
    background:var(--burgundy);
    color:#fff;
  }

  .searchrow{
    display:flex; gap:8px;
  }
  .searchbox{
    flex:1;
    display:flex; align-items:center; gap:7px;
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-md);
    padding:10px 12px;
  }
  .searchbox svg{width:16px;height:16px;color:var(--ink-faint); flex:none;}
  .searchbox input{
    border:none;background:none;outline:none;color:var(--ink);
    font-size:15px; width:100%; font-family:inherit;
  }
  .searchbox input::placeholder{color:var(--ink-faint);}
  .searchclear{
    flex:none; border:none; background:var(--rule-strong); color:var(--ink);
    width:20px;height:20px; border-radius:50%; cursor:pointer;
    display:flex;align-items:center;justify-content:center; font-size:11px; padding:0;
  }

  .chiprow{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none;
  }
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;
    border:1px solid var(--rule-strong);
    background:var(--paper);
    color:var(--ink-muted);
    padding:7px 13px;
    border-radius:999px;
    font-family:'Barlow Condensed', sans-serif;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    cursor:pointer;
    display:flex; align-items:center; gap:5px;
    white-space:nowrap;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%; flex:none;}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .chip.active .dot{outline:1.5px solid var(--paper); outline-offset:1px;}

  /* ---------- Timeline ---------- */
  main{
    flex:1;
    padding:6px 0 40px;
  }
  .daylabel-row{
    padding:18px 18px 8px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .daylabel{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    color:var(--heading);
    text-transform:uppercase;
    letter-spacing:.07em;
    font-size:13.5px;
  }
  .jumpnow{
    flex:none;
    border:1px solid var(--burgundy);
    background:var(--paper);
    color:var(--burgundy);
    border-radius:999px;
    padding:5px 12px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:11.5px;
    cursor:pointer;
  }
  .today-dot{
    display:inline-block; width:6px;height:6px;border-radius:50%;
    background:var(--burgundy); margin-left:3px; vertical-align:2px;
  }
  .empty{
    padding:50px 24px;
    text-align:center;
    color:var(--ink-faint);
  }
  .empty .big{font-size:28px; margin-bottom:8px; display:block;}
  .empty p{margin:4px 0 14px; font-size:14px;}
  .empty button{
    border:1px solid var(--ink);
    background:var(--paper);
    border-radius:var(--radius-sm);
    padding:10px 18px;
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink);
    margin:0 4px 8px;
  }

  .row{
    display:flex;
    padding:2px 14px;
    gap:10px;
    align-items:stretch;
  }
  .row.live .card{
    box-shadow:0 0 0 1.5px var(--burgundy);
  }
  .live-badge{
    background:var(--burgundy) !important;
    color:#fff !important;
    border-color:var(--burgundy) !important;
  }
  .rail{
    flex:none;
    width:54px;
    padding-top:14px;
    text-align:right;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-faint);
    font-weight:500;
  }
  .rail .end{display:block; opacity:.65; font-size:10.5px; margin-top:1px;}

  .card{
    flex:1;
    margin:6px 0;
    background:var(--paper);
    border:1px solid var(--rule);
    border-top:3px solid var(--cat-color, var(--slate));
    border-radius:var(--radius-md);
    padding:13px 14px 13px 14px;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .card .toprow{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  }
  .card h3{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0;
    margin:0;
    line-height:1.28;
    text-wrap:balance;
    color:var(--ink);
  }
  .card .meta{
    font-size:13.5px;
    color:var(--ink-muted);
    line-height:1.45;
  }
  .card .tagsrow{
    display:flex; gap:6px; align-items:center; margin-top:2px; flex-wrap:wrap;
  }
  .badge{
    font-family:'Barlow Condensed', sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:var(--radius-sm);
    background:var(--cat-color, var(--slate));
    color:#fff;
  }
  .badge.outline{
    background:transparent;
    border:1px solid var(--rule-strong);
    color:var(--ink-faint);
  }
  .star{
    flex:none;
    width:34px;height:34px;
    border:1px solid var(--rule);
    border-radius:var(--radius-sm);
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink-faint);
  }
  .star svg{width:17px;height:17px;}
  .star.saved{color:#fff; background:var(--burgundy); border-color:var(--burgundy);}
  .star.saved svg{fill:#fff;}

  .grouphead{
    display:flex; align-items:center; gap:8px;
    padding:2px 3px 4px;
  }
  .grouphead .n{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    background:var(--paper-sunken);
    padding:2px 7px;
  }

  .subgrid{
    display:grid;
    grid-template-columns:1fr;
    gap:7px;
    margin-top:4px;
  }
  .subcard{
    background:var(--paper-sunken);
    border:1px solid var(--rule);
    border-left:3px solid var(--slate);
    border-radius:var(--radius-sm);
    padding:10px 11px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    cursor:pointer;
  }
  .subcard .stxt{flex:1;}
  .subcard .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--slate);
    font-weight:600;
  }
  .subcard h4{
    font-size:14.5px;
    margin:2px 0 2px;
    font-weight:700;
    font-family:'Barlow',sans-serif;
    line-height:1.35;
  }
  .subcard .org{font-size:12.5px; color:var(--ink-muted);}

  /* ---------- Detail sheet ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(10,9,8,0.5);
    z-index:90; opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .scrim.show{opacity:1; pointer-events:auto;}
  .toast{
    position:fixed; left:50%; bottom:22px; z-index:120;
    transform:translate(-50%,12px); opacity:0; pointer-events:none;
    background:var(--ink); color:var(--paper);
    font-size:13.5px; font-weight:600;
    padding:11px 18px; border-radius:999px;
    max-width:88vw; text-align:center;
    box-shadow:0 6px 22px rgba(0,0,0,.28);
    transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:91;
    max-width:640px; margin:0 auto;
    background:var(--paper);
    border-top:3px solid var(--burgundy);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    max-height:86vh;
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .22s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
  }
  .sheet.show{transform:translateY(0);}
  .sheet .handle{
    width:36px;height:4px;background:var(--rule-strong);
    margin:10px auto 4px;
  }
  .sheet-scroll{
    overflow-y:auto;
    padding:6px 20px 28px;
  }
  .backlink{
    display:flex; align-items:center; gap:4px;
    border:none; background:none; padding:6px 0 0; margin:0;
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12.5px;
    text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-muted); cursor:pointer;
  }
  .backlink svg{width:14px;height:14px;flex:none;}
  .backlink:hover{color:var(--ink);}
  .sheet-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding-top:6px;
  }
  .sheet-top .close{
    border:1px solid var(--rule-strong);background:var(--paper);
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; color:var(--ink-muted); flex:none;
  }
  .sheet h2{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:25px;
    line-height:1.22;
    margin:8px 0 8px;
    text-wrap:balance;
    color:var(--ink);
  }
  .sheet .when{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--ink-muted);
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    margin-bottom:10px;
  }
  .sheet .desc{
    font-size:15px;
    color:var(--ink);
    line-height:1.62;
    margin:10px 0;
  }
  .sheet .desc p{margin:0 0 10px;}
  .sheet .note{
    font-size:13px;
    color:var(--ink);
    background:var(--charcoal-soft);
    border-left:3px solid var(--charcoal);
    border-radius:var(--radius-sm);
    padding:9px 11px;
    margin:10px 0;
    line-height:1.5;
  }
  .speakerlist{
    display:flex; flex-direction:column; gap:10px; margin:10px 0 4px;
  }
  .speaker{
    display:flex; gap:10px; align-items:center;
    cursor:pointer;
  }
  .speaker .av{
    flex:none; width:36px;height:36px;
    border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13.5px;
    color:#fff; letter-spacing:.02em;
    object-fit:cover;
  }
  .speaker .name{font-weight:700; font-size:14.5px;}
  .speaker .role{font-size:13px; color:var(--ink-muted);}

  /* ---------- Speaker profile sheet ---------- */
  .speakerhero{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:2px; margin:6px 0 16px;
  }
  .speakerhero .av-lg{
    width:152px; height:152px;
    border-radius:var(--radius-md);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:46px;
    color:#fff; letter-spacing:.02em;
    object-fit:cover;
    box-shadow:0 6px 22px rgba(10,9,8,.22);
    margin-bottom:12px;
  }
  .speakerhero .name{
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:23px;
    color:var(--heading);
  }
  .speakerhero .role{font-size:14px; color:var(--ink-muted); margin-top:2px; max-width:440px;}
  .speaker-sessions-lbl{
    font-size:11.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em;
    font-weight:700; margin:0 0 8px;
  }
  .sheet-actions{
    display:flex; gap:8px; margin-top:14px;
  }
  .btn{
    flex:1;
    padding:13px 14px;
    border-radius:var(--radius-sm);
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:14.5px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
  }
  .btn.primary{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .btn.primary.saved{
    background:var(--burgundy);
    border-color:var(--burgundy);
    color:#fff;
  }
  .btn svg{width:15px;height:15px;}

  /* ---------- My Plan ---------- */
  .planhead{
    padding:18px 18px 4px;
  }
  .planhead h2{
    font-family:'Barlow Condensed',sans-serif; font-weight:800; text-transform:uppercase;
    letter-spacing:.01em; font-size:23px; margin:0 0 4px; color:var(--heading);
  }
  .planhead p{margin:0; font-size:13.5px; color:var(--ink-muted);}
  .plan-summary{
    display:flex; gap:1px; padding:14px 18px 4px;
    border:1px solid var(--rule);
    border-radius:var(--radius-md);
    overflow:hidden;
  }
  .plan-actions{padding:12px 18px 2px;}
  .plan-actions .btn{
    width:auto; flex:none; display:inline-flex; gap:7px;
    padding:9px 16px;
  }
  .plan-actions .btn svg{width:15px;height:15px;}
  .sharebox{
    display:flex; gap:8px; margin:14px 0 4px;
  }
  .sharebox input{
    flex:1; min-width:0;
    background:var(--paper-raised); border:1px solid var(--rule);
    border-radius:var(--radius-sm); padding:10px 12px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink);
  }
  .sharebox .btn{flex:none; width:auto; padding:10px 16px;}
  .qrwrap{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin:20px 0 8px;
  }
  .qrwrap #qrHolder{
    background:#fff; padding:12px; border-radius:var(--radius-md);
    box-shadow:0 4px 16px rgba(0,0,0,.15);
    line-height:0;
  }
  .qrhint{font-size:12.5px; color:var(--ink-muted);}
  .qrfallback{
    width:168px; height:168px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:12px; line-height:1.4; color:#666; padding:10px;
    box-sizing:border-box;
  }
  .importbar{
    display:none; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--charcoal-soft); border-bottom:1px solid var(--rule);
    padding:10px 18px; font-size:13px; color:var(--ink);
  }
  .importbar.show{display:flex;}
  .importbar .btn{
    flex:none; width:auto; padding:6px 12px; font-size:12.5px;
  }
  .stat{
    flex:1;
    background:var(--paper-raised);
    padding:11px 12px;
  }
  .stat .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px; font-weight:600; color:var(--burgundy);
    display:block;
  }
  .stat .lbl{font-size:10.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em;}

  /* ---------- Speakers view ---------- */
  .speakerdir{
    padding:10px 18px 30px;
    display:flex; flex-direction:column; gap:0;
  }
  .sp-row{
    display:flex; gap:13px; padding:14px 0;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
    align-items:center;
  }
  .sp-row .av{
    flex:none; width:54px;height:54px;
    border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:19px;
    color:#fff; letter-spacing:.02em;
    object-fit:cover;
  }
  .sp-row .name{font-weight:700; font-size:16px; font-family:'Barlow',sans-serif;}
  .sp-row .role{font-size:13.5px; color:var(--ink-muted); margin-top:1px;}
  .sp-row .sessions{font-size:11.5px; color:var(--heading); margin-top:5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; line-height:1.4;}

  /* ---------- Map view ---------- */
  .mapfigwrap{
    padding:8px 18px 4px;
  }
  .mapfig{
    margin:0;
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-md);
    padding:14px 10px 12px;
  }
  .mapfig svg{
    display:block;
    width:100%;
    height:auto;
  }
  .mapfig figcaption{
    font-size:12.5px;
    color:var(--ink-faint);
    line-height:1.55;
    padding:10px 6px 2px;
  }
  .maplegend{
    display:flex; flex-direction:column; gap:2px;
    padding:12px 18px 4px;
  }
  .maplegend-row{
    display:flex; gap:10px; align-items:flex-start;
    padding:10px 0;
    border-bottom:1px solid var(--rule);
  }
  .maplegend-row:last-child{border-bottom:none;}
  .maplegend-row .dot{
    width:11px;height:11px;border-radius:50%;flex:none;margin-top:4px;
  }
  .maplegend-row .mlt{font-weight:700; font-size:13.5px; margin-bottom:2px; text-transform:uppercase; letter-spacing:.03em; font-family:'Barlow Condensed',sans-serif;}
  .maplegend-row .mld{font-size:13px; color:var(--ink-muted); line-height:1.55;}

  /* ---------- Info view ---------- */
  .info{
    padding:14px 18px 40px;
  }
  .info h2{
    font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin:24px 0 8px; color:var(--heading);
  }
  .info h2:first-child{margin-top:4px;}
  .info p{font-size:14.5px; line-height:1.68; color:var(--ink); margin:0 0 10px;}
  .infocard{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:var(--radius-md);
    padding:15px 16px;
    margin-bottom:10px;
  }
  .kv{
    display:flex; justify-content:space-between; gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--rule);
    font-size:14px;
  }
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-muted);}
  .kv .v{font-weight:700; text-align:right;}
  .taglist{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tagpill{
    font-size:11.5px; background:var(--paper-sunken); border:1px solid var(--rule);
    border-radius:999px;
    padding:5px 11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; font-weight:600;
  }

  @media (min-width:641px){
    .app{border-left:1px solid var(--rule); border-right:1px solid var(--rule);}
  }

function speakerColorVar(name){
  var h = 0;
  for(var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
  return SPEAKER_HUES[h % SPEAKER_HUES.length];
}

function avatarHTML(name, large){
  var photo = SPEAKER_PHOTOS[name];
  var cls = large ? 'av av-lg' : 'av';
  if (photo) {
    return '<img class="'+cls+'" src="'+photo+'" alt="" loading="lazy">';
  }
  return '<div class="'+cls+'" style="background:var('+speakerColorVar(name)+')">'+initials(name)+'</div>';
}

var EVENTS_BY_ID = {};
EVENTS.forEach(function(e){ EVENTS_BY_ID[e.id] = e; });

/* ============================= STATE ============================= */

var state = {
  view: 'schedule',
  day: 1,
  cat: 'all',
  query: '',
  sheetId: null,
  sheetStack: []
};

var SAVED_KEY = 'tec26-myplan-v1';
var THEME_KEY = 'tec26-theme';

function loadSaved(){
  try{
    var raw = localStorage.getItem(SAVED_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function persistSaved(){
  try{ localStorage.setItem(SAVED_KEY, JSON.stringify(saved)); }catch(e){}
}
var saved = loadSaved();

function isSaved(id){ return saved.indexOf(id) > -1; }
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
function toggleSaved(id){
  var i = saved.indexOf(id);
  var e = EVENTS_BY_ID[id];
  var title = e ? e.title : 'Session';
  if(i>-1){ saved.splice(i,1); showToast('Removed “'+title+'” from My Plan'); }
  else { saved.push(id); showToast('Added “'+title+'” to My Plan'); }
  persistSaved();
  render();
  if(document.getElementById('sheet').classList.contains('show') && state.sheetId){
    if(typeof state.sheetId === 'string' && state.sheetId.indexOf('speaker:')===0){
      openSpeakerSheet(state.sheetId.slice(8), true);
    } else {
      openSheet(state.sheetId, true);
    }
  }
}

/* ============================= THEME ============================= */

var SUN = 'M12 3v2M12 19v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M3 12h2M19 12h2M4.6 19.4L6 18M18 6l1.4-1.4M12 8a4 4 0 100 8 4 4 0 000-8z';
var MOON = 'M20 14.5A8.5 8.5 0 119.5 4a7 7 0 1010.5 10.5z';

function loadTheme(){
  // Dark is the default until the person explicitly picks a theme with the toggle.
  try{
    var t = localStorage.getItem(THEME_KEY);
    return (t === 'light' || t === 'dark') ? t : 'dark';
  }catch(e){ return 'dark'; }
}
function applyTheme(t){
  var root = document.documentElement;
  if(t === 'light' || t === 'dark'){ root.setAttribute('data-theme', t); }
  else { root.removeAttribute('data-theme'); }
  var icon = document.getElementById('themeIcon');
  var isDark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  icon.innerHTML = '<path d="'+(isDark ? SUN : MOON)+'"/>';
}
var currentTheme = loadTheme();
applyTheme(currentTheme);
document.getElementById('themeToggle').addEventListener('click', function(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  currentTheme = isDark ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, currentTheme); }catch(e){}
  applyTheme(currentTheme);
});

/* ============================= HELPERS ============================= */

function esc(s){
  return (s||'').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function catColor(cat){ return (CATS[cat]||CATS.side).color; }
function catSoft(cat){ return (CATS[cat]||CATS.side).soft; }
function catLabel(cat){ return (CATS[cat]||CATS.side).label; }
function initials(name){
  var parts = name.split(' ').filter(Boolean);
  if(parts.length===0) return '?';
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function dayLabel(d){ return d===1 ? 'Thursday, 10 September' : 'Friday, 11 September'; }
function dayShort(d){ return d===1 ? 'Thu' : 'Fri'; }

function matchesQuery(e, query){
  if(!query) return true;
  var q = query.toLowerCase();
  var hay = (e.title+' '+e.room+' '+e.desc+' '+(e.speakers||[]).map(function(s){return s.name+' '+s.role;}).join(' ')).toLowerCase();
  if(hay.indexOf(q) > -1) return true;
  // also check children (workshops)
  if(e.isGroup && e.childIds){
    return e.childIds.some(function(cid){
      var c = EVENTS_BY_ID[cid];
      return c && (c.title+' '+c.desc).toLowerCase().indexOf(q) > -1;
    });
  }
  return false;
}

function matchesFilters(e){
  if(e.day !== state.day) return false;
  if(state.cat !== 'all' && e.cat !== state.cat) return false;
  if(!matchesQuery(e, state.query)) return false;
  return true;
}

function timelineEvents(){
  return EVENTS.filter(function(e){ return !e.slotTBC; })
    .filter(matchesFilters)
    .sort(function(a,b){ return a.start.localeCompare(b.start); });
}

/* ============================= "NOW" (live day/time) ============================= */

function pad2(n){ return (n<10?'0':'')+n; }
function nowInfo(){
  var d = new Date();
  var day = null;
  if(d.getFullYear()===2026 && d.getMonth()===8 && d.getDate()===10) day = 1;
  else if(d.getFullYear()===2026 && d.getMonth()===8 && d.getDate()===11) day = 2;
  if(!day) return null;
  return {day:day, time: pad2(d.getHours())+':'+pad2(d.getMinutes())};
}
function isLiveNow(e){
  var n = nowInfo();
  if(!n || e.isGroup || e.day !== n.day) return false;
  return n.time >= e.start && n.time < e.end;
}

/* ============================= RENDER: SCHEDULE ============================= */

function renderSchedule(){
  var list = timelineEvents();
  var n = nowInfo();
  var html = '';
  html += '<div class="controls">';
  html += '  <div class="daybar">';
  [1,2].forEach(function(d){
    var isToday = n && n.day === d;
    html += '<button data-day="'+d+'" class="'+(state.day===d?'active':'')+'">'+dayShort(d)+(isToday?' <span class="today-dot" aria-hidden="true"></span>':'')+'<span class="d">'+(d===1?'10 Sep':'11 Sep')+'</span></button>';
  });
  html += '  </div>';
  html += '  <div class="searchrow">';
  html += '    <div class="searchbox">';
  html += '      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
  html += '      <input id="searchInput" type="text" placeholder="Search sessions, speakers, topics…" value="'+esc(state.query)+'">';
  if(state.query) html += '      <button id="searchClear" class="searchclear" aria-label="Clear search">✕</button>';
  html += '    </div>';
  html += '  </div>';
  html += '  <div class="chiprow" id="chipRow">';
  html += chip('all', 'All', null);
  Object.keys(CATS).forEach(function(c){ html += chip(c, CATS[c].label, c); });
  html += '  </div>';
  html += '</div>';

  html += '<div class="daylabel-row"><div class="daylabel">'+dayLabel(state.day)+'</div>';
  if(n) html += '<button id="jumpNow" class="jumpnow">'+(n.day===state.day?'Jump to now':'Go to today')+'</button>';
  html += '</div>';

  if(list.length === 0){
    html += emptyStateHTML();
  } else {
    list.forEach(function(e){ html += eventRow(e); });
  }
  return html;
}

function emptyStateHTML(){
  var filterBits = [];
  if(state.cat !== 'all') filterBits.push('“'+catLabel(state.cat)+'”');
  if(state.query) filterBits.push('“'+state.query+'”');
  var why = filterBits.length ? 'No sessions on '+dayLabel(state.day)+' match '+filterBits.join(' + ')+'.' : 'No sessions on '+dayLabel(state.day)+'.';

  var otherDay = state.day === 1 ? 2 : 1;
  var otherMatches = state.query ? EVENTS.filter(function(e){
    return e.day===otherDay && !e.slotTBC && (state.cat==='all'||e.cat===state.cat) && matchesQuery(e, state.query);
  }) : [];

  var html = '<div class="empty"><span class="big">🔍</span><p>'+esc(why)+'</p>';
  if(otherMatches.length){
    html += '<p style="margin-top:-6px">Found '+otherMatches.length+' match'+(otherMatches.length>1?'es':'')+' on '+dayLabel(otherDay)+' instead.</p>';
    html += '<button id="goOtherDay" data-goday="'+otherDay+'">Switch to '+dayLabel(otherDay).split(',')[0]+'</button>';
  }
  html += '<button id="clearFilters">Clear filters</button></div>';
  return html;
}

function chip(key,label,cat){
  var active = state.cat === key;
  var dot = cat ? '<span class="dot" style="background:var('+catColor(cat)+')"></span>' : '';
  return '<button class="chip'+(active?' active':'')+'" data-cat="'+key+'">'+dot+label+'</button>';
}

function eventRow(e){
  var color = catColor(e.cat), soft = catSoft(e.cat);
  var sub = e.room || (e.speakers[0] ? e.speakers[0].role : '');
  var speakerLine = e.speakers && e.speakers.length ? e.speakers.map(function(s){return s.name;}).join(', ') : sub;
  var savedCls = isSaved(e.id) ? ' saved' : '';
  var live = isLiveNow(e);
  var html = '<div class="row'+(live?' live':'')+'"'+(live?' id="liveRow"':'')+'>';
  html += '  <div class="rail">'+e.start+'<span class="end">'+e.end+'</span></div>';
  html += '  <div class="card" style="--cat-color:var('+color+');--cat-soft:var('+soft+')" data-open="'+e.id+'">';
  html += '    <div class="toprow">';
  html += '      <h3>'+esc(e.title)+'</h3>';
  if(!e.isGroup){
    html += '      <button class="star'+savedCls+'" data-save="'+e.id+'" aria-label="Save to My Plan">'+starIcon(isSaved(e.id))+'</button>';
  }
  html += '    </div>';
  if(speakerLine) html += '    <div class="meta">'+esc(speakerLine)+'</div>';
  html += '    <div class="tagsrow">'+(live?'<span class="badge live-badge">● Now</span>':'')+'<span class="badge" style="--cat-color:var('+color+');--cat-soft:var('+soft+')">'+catLabel(e.cat)+'</span>';
  if(e.note) html += '<span class="badge outline">Note</span>';
  html += '</div>';
  html += '  </div>';
  html += '</div>';
  return html;
}

function starIcon(filled){
  return '<svg viewBox="0 0 24 24" fill="'+(filled?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z"/></svg>';
}
function shareIcon(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>';
}

/* ============================= RENDER: MY PLAN ============================= */

function renderPlan(){
  var timedSaved = EVENTS.filter(function(e){ return isSaved(e.id) && !e.slotTBC; });
  var workshopSaved = EVENTS.filter(function(e){ return isSaved(e.id) && e.slotTBC; });
  var byDay = {1:[], 2:[]};
  timedSaved.forEach(function(e){ byDay[e.day].push(e); });
  byDay[1].sort(function(a,b){return a.start.localeCompare(b.start);});
  byDay[2].sort(function(a,b){return a.start.localeCompare(b.start);});

  var totalSaved = timedSaved.length + workshopSaved.length;
  var html = '';
  html += '<div class="planhead"><h2>My Plan</h2><p>Bookmarked sessions across both days, saved on this device.</p></div>';
  html += '<div class="plan-summary">';
  html += '  <div class="stat"><span class="num">'+timedSaved.length+'</span><span class="lbl">Scheduled</span></div>';
  html += '  <div class="stat"><span class="num">'+workshopSaved.length+'</span><span class="lbl">Workshops to confirm</span></div>';
  html += '  <div class="stat"><span class="num">'+totalSaved+'</span><span class="lbl">Total</span></div>';
  html += '</div>';

  if(totalSaved > 0){
    html += '<div class="plan-actions"><button id="sharePlan" class="btn">'+shareIcon()+'Share My Plan</button></div>';
  }

  if(timedSaved.length === 0 && workshopSaved.length === 0){
    html += '<div class="empty"><span class="big">☆</span><p>Nothing saved yet.</p><p style="margin-top:-6px">Tap the star on any session in the Schedule to add it here.</p><button id="goSchedule">Browse the schedule</button></div>';
    return html;
  }

  [1,2].forEach(function(d){
    if(byDay[d].length === 0) return;
    html += '<div class="daylabel">'+dayLabel(d)+'</div>';
    byDay[d].forEach(function(e){ html += eventRow(e); });
  });

  if(workshopSaved.length){
    html += '<div class="daylabel">Workshops · Day 1 afternoon (slot to confirm)</div>';
    html += '<div class="subgrid" style="padding:2px 14px;">';
    workshopSaved.forEach(function(w){ html += subcard(w); });
    html += '</div>';
  }
  return html;
}

/* ============================= RENDER: SPEAKERS ============================= */

function buildSpeakerDirectory(){
  var map = {};
  EVENTS.forEach(function(e){
    (e.speakers||[]).forEach(function(s){
      if(!map[s.name]) map[s.name] = {name:s.name, role:s.role, sessions:[]};
      map[s.name].sessions.push(e);
    });
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){
    var an = a.name.split(' ').pop(), bn = b.name.split(' ').pop();
    return an.localeCompare(bn);
  });
}

function renderSpeakers(){
  var dir = buildSpeakerDirectory();
  var html = '<div class="planhead"><h2>Speakers</h2><p>'+dir.length+' confirmed speakers across keynotes and panels. Photos from the official Technology Talks speaker pages, where available.</p></div>';
  html += '<div class="speakerdir">';
  dir.forEach(function(sp){
    html += '<div class="sp-row" data-open-speaker="'+esc(sp.name)+'">';
    html += '  '+avatarHTML(sp.name);
    html += '  <div style="flex:1">';
    html += '    <div class="name">'+esc(sp.name)+'</div>';
    html += '    <div class="role">'+esc(sp.role)+'</div>';
    html += '    <div class="sessions">'+sp.sessions.map(function(s){return s.title.replace(/^([\w\s]+—\s*)/,'');}).join(' · ')+'</div>';
    html += '  </div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

/* ============================= RENDER: MAP ============================= */

function renderMap(){
  var html = '<div class="planhead"><h2>Venue Map</h2><p>MuseumsQuartier Wien · Museumsplatz 1, 1070 Wien</p></div>';

  html += '<div class="mapfigwrap">';
  html += '<figure class="mapfig">';
  html += mapSVG();
  html += '<figcaption>Schematic orientation sketch of MuseumsQuartier Wien — not a scaled floor plan. Positions of buildings within the complex are approximate; follow on-site signage for exact rooms.</figcaption>';
  html += '</figure>';
  html += '</div>';

  html += '<div class="maplegend">';
  html += mapLegendRow('--burgundy','Halle E+G','Keynotes, panels, ceremonies, check-in & badge collection — register with your ticket at the Halle E foyer.');
  html += mapLegendRow('--slate','Quartier21 area','Parallel workshops and Friday breakfast events — exact rooms are shown on the on-site signage and your badge.');
  html += mapLegendRow('--mist','Kunsthalle Wien & mumok','Free guided artloop tours ("Science meets Arts") for all participants — Kunsthalle Wien galleries and the mumok ground floor.');
  html += '</div>';

  html += '<div class="info" style="padding-top:4px;">';
  html += '<h2>Getting there</h2>';
  html += '<div class="infocard">';
  html += kv('Address','Museumsplatz 1, 1070 Wien');
  html += kv('U-Bahn','U3 Volkstheater (exit Burggasse)');
  html += kv('Tram','Line 49 to Volkstheater');
  html += kv('Bus','48A to Volkstheater · City Bus 2B to MuseumsQuartier');
  html += '</div>';
  html += '<p>Centrally located in Vienna’s 7th district, within walking distance of the Ring, Mariahilfer Straße and the Inner City. Bicycle parking is available throughout the MuseumsQuartier grounds.</p>';

  html += '<h2>Check-in</h2>';
  html += '<p>Register with your ticket at the <strong>Halle E foyer</strong> to collect your badge. Wear it on both days — it’s scanned at individual sessions for attendance statistics.</p>';

  html += '<h2>Accessibility</h2>';
  html += '<p>Step-free routes and accessibility services are detailed by the venue directly: Halle E (halleneg.at/lage-und-service) and the wider MuseumsQuartier (mqw.at/de/besuch/barrierefreiheit).</p>';
  html += '</div>';
  return html;
}

    '<span class="dot" style="background:var('+colorVar+')"></span>'+
    '<div><div class="mlt">'+title+'</div><div class="mld">'+desc+'</div></div>'+
  '</div>';
}

/* ============================= RENDER: INFO ============================= */

  html += '<p>Austria’s leading research and technology conference runs back-to-back with the FFG Forum, across two keynotes, six plenary panels, twelve workshops, and a full programme of side events, breakfasts and networking.</p>';

  html += '<h2>Details</h2>';
  html += '<div class="infocard">';
  html += kv('Dates','10–11 September 2026');
  html += kv('Venue','MuseumsQuartier Wien');
  html += kv('General admission','€250');
  html += kv('Student rate','€125 (up to age 27, valid student ID)');
  html += kv('Tickets','tickets.technologytalks.ait.ac.at');
  html += kv('Email','technologytalks@ait.ac.at');
  html += kv('Phone','+43 50550-0');
  html += '</div>';

  html += '<h2>Organised by</h2>';
  html += '<p>AIT Austrian Institute of Technology, in close cooperation with the Federal Ministry for Innovation, Mobility and Infrastructure (BMIMI), the Federal Ministry for Women, Science and Research (BMFWF), the Federal Ministry for Economy, Energy and Tourism (BMWET), the Austrian Research Promotion Agency (FFG) and the Federation of Austrian Industries (IV).</p>';

  html += '<h2>Scientific partners</h2>';
  html += '<div class="taglist">'+['acatech','AIT','Christian Doppler Gesellschaft','Forschung Austria','ISTA','TU Austria','ÖAW','FWF'].map(tag).join('')+'</div>';

  html += '<h2>Exhibition &amp; community area</h2>';
  html += '<p>UNICEF, APA (Austria Presse Agentur), NEAT, BMLV, ESBS Austria, JOANNEUM RESEARCH, TU Austria and Gaia-X Hub Austria present in the exhibition and exchange area throughout both days.</p>';

  html += '<h2>Science meets Arts</h2>';
  html += '<p>AIT’s new art programme <strong>artloop</strong> offers participants short guided tours in the Kunsthalle Wien (free entry for all Technology Talks participants) and on the ground floor of mumok, curated by Klaus Speidel.</p>';

function kv(k,v){ return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
function tag(t){ return '<span class="tagpill">'+t+'</span>'; }

/* ============================= SUBCARD (workshops) ============================= */

function speakerSessionRow(e){
  var savedCls = isSaved(e.id) ? ' saved' : '';
  return '<div class="subcard" data-open="'+e.id+'">'+
    '<div class="stxt"><span class="num">'+dayLabel(e.day)+' · '+e.start+'–'+e.end+'</span><h4>'+esc(e.title)+'</h4><div class="org">'+esc(e.room)+'</div></div>'+
    '<button class="star'+savedCls+'" data-save="'+e.id+'" aria-label="Save to My Plan">'+starIcon(isSaved(e.id))+'</button>'+
  '</div>';
}

function subcard(w){
  var savedCls = isSaved(w.id) ? ' saved' : '';
  var num = w.id.replace('w','');
  return '<div class="subcard" data-open="'+w.id+'">'+
    '<div class="stxt"><span class="num">WORKSHOP '+num+'</span><h4>'+esc(w.title)+'</h4><div class="org">'+esc(w.room)+' · '+esc(w.lang||'')+'</div></div>'+
    '<button class="star'+savedCls+'" data-save="'+w.id+'" aria-label="Save to My Plan">'+starIcon(isSaved(w.id))+'</button>'+
  '</div>';
}

/* ============================= SHEET (detail view) ============================= */

var lastFocusedTrigger = null;

function currentSheetDescriptor(){
  if(typeof state.sheetId === 'string' && state.sheetId.indexOf('speaker:')===0){
    return {type:'speaker', name: state.sheetId.slice(8)};
  }
  return {type:'event', id: state.sheetId};
}
function backLinkHTML(){
  if(!state.sheetStack.length) return '';
  var prev = state.sheetStack[state.sheetStack.length-1];
  var label = prev.type==='speaker' ? prev.name : (EVENTS_BY_ID[prev.id] ? EVENTS_BY_ID[prev.id].title : 'Back');
  return '<button type="button" class="backlink" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back to '+esc(label)+'</button>';
}
function goBack(){
  var prev = state.sheetStack.pop();
  if(!prev){ closeSheet(); return; }
  if(prev.type==='speaker') openSpeakerSheet(prev.name); else openSheet(prev.id);
}

function openShareSheet(){
  state.sheetId = 'share';
  var url = location.origin + location.pathname + '#plan=' + saved.join(',');
  var count = saved.length;
  var html = '';
  html += '<div class="sheet-top"><span class="badge" style="--cat-color:var(--charcoal);--cat-soft:var(--charcoal-soft)">Share</span><button class="close" id="sheetClose" aria-label="Close">✕</button></div>';
  html += '<h2>Share My Plan</h2>';
  html += '<div class="desc"><p>Send this link to a colleague, or scan it on another phone — opening it offers to add these '+count+' saved session'+(count>1?'s':'')+' to whoever opens it. Nothing is uploaded; the link just carries the list.</p></div>';
  html += '<div class="sharebox"><input id="shareUrlInput" type="text" readonly value="'+esc(url)+'"><button id="copyLink" class="btn primary" type="button">Copy link</button></div>';
  html += '<div class="qrwrap"><div id="qrHolder"></div><div class="qrhint">Scan to open on another phone</div></div>';
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('scrim').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  wireSheet();
  focusSheet();
  renderQR(url);
}
function renderQR(url){
  var holder = document.getElementById('qrHolder');
  if(!holder) return;
  if(window.QRCode){
    holder.innerHTML = '';
    new QRCode(holder, {text:url, width:168, height:168, colorDark:'#0A0908', colorLight:'#FFFFFF', correctLevel: QRCode.CorrectLevel.M});
  } else {
    holder.innerHTML = '<div class="qrfallback">QR code unavailable right now — copy the link above instead.</div>';
  }
}

function checkIncomingPlan(){
  var m = location.hash.match(/plan=([^&]*)/);
  if(!m) return;
  var ids = decodeURIComponent(m[1]).split(',').map(function(s){return s.trim();}).filter(function(id){ return id && EVENTS_BY_ID[id]; });
  history.replaceState(null, '', location.pathname + location.search);
  if(!ids.length) return;
  var newOnes = ids.filter(function(id){ return saved.indexOf(id) === -1; });
  if(!newOnes.length){ showToast('Those sessions are already in your My Plan'); return; }
  showImportBar(ids, newOnes);
}
function showImportBar(allIds, newOnes){
  var bar = document.getElementById('importBar');
  if(!bar) return;
  bar.innerHTML = '<span>This link includes '+allIds.length+' shared session'+(allIds.length>1?'s':'')+' ('+newOnes.length+' new for you). </span>'+
    '<button id="importMerge" class="btn primary" type="button">Add to My Plan</button>'+
    '<button id="importDismiss" class="btn" type="button">Dismiss</button>';
  bar.classList.add('show');
  document.getElementById('importMerge').addEventListener('click', function(){
    newOnes.forEach(function(id){ saved.push(id); });
    persistSaved();
    bar.classList.remove('show');
    bar.innerHTML = '';
    render();
    showToast('Added '+newOnes.length+' session'+(newOnes.length>1?'s':'')+' to My Plan');
  });
  document.getElementById('importDismiss').addEventListener('click', function(){
    bar.classList.remove('show');
    bar.innerHTML = '';
  });
}

function openSpeakerSheet(name, skipFocus){
  var dir = buildSpeakerDirectory();
  var sp = dir.filter(function(s){return s.name===name;})[0];
  if(!sp) return;
  state.sheetId = 'speaker:'+name;
  var html = '';
  html += backLinkHTML();
  html += '<div class="sheet-top"><span class="badge" style="--cat-color:var(--charcoal);--cat-soft:var(--charcoal-soft)">Speaker</span><button class="close" id="sheetClose" aria-label="Close">✕</button></div>';
  html += '<div class="speakerhero">'+avatarHTML(sp.name, true)+'<div class="name">'+esc(sp.name)+'</div><div class="role">'+esc(sp.role)+'</div></div>';
  html += '<div class="speaker-sessions-lbl">Appears in '+sp.sessions.length+' session'+(sp.sessions.length>1?'s':'')+' — tap to view time, room and add to My Plan</div>';
  html += '<div class="subgrid">';
  sp.sessions.forEach(function(e){ html += speakerSessionRow(e); });
  html += '</div>';
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('scrim').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  wireSheet();
  if(!skipFocus) focusSheet();
}

function openSheet(id, skipFocus){
  state.sheetId = id;
  var e = EVENTS_BY_ID[id];
  if(!e) return;
  var color = catColor(e.cat);
  var html = '';
  html += backLinkHTML();
  html += '<div class="sheet-top"><span class="badge" style="--cat-color:var('+color+');--cat-soft:var('+catSoft(e.cat)+')">'+catLabel(e.cat)+'</span><button class="close" id="sheetClose" aria-label="Close">✕</button></div>';
  html += '<h2>'+esc(e.title)+'</h2>';
  html += '<div class="when">';
  html += '<span class="mono">'+dayLabel(e.day)+'</span>';
  if(!e.isGroup) html += '<span>·</span><span class="mono">'+e.start+'–'+e.end+'</span>';
  if(e.room) html += '<span>·</span><span>'+esc(e.room)+'</span>';
  html += '</div>';

  if(e.note){ html += '<div class="note">'+esc(e.note)+'</div>'; }

  html += '<div class="desc"><p>'+esc(e.desc)+'</p></div>';

  if(e.speakers && e.speakers.length){
    html += '<div class="speakerlist">';
    e.speakers.forEach(function(s){
      html += '<div class="speaker" data-open-speaker="'+esc(s.name)+'">'+avatarHTML(s.name)+'<div><div class="name">'+esc(s.name)+'</div><div class="role">'+esc(s.role)+'</div></div></div>';
    });
    html += '</div>';
  }

  if(e.isGroup && e.childIds){
    html += '<div class="subgrid" style="margin-top:12px;">';
    e.childIds.forEach(function(cid){ html += subcard(EVENTS_BY_ID[cid]); });
    html += '</div>';
  }

  if(!e.isGroup){
    var isSv = isSaved(e.id);
    html += '<div class="sheet-actions">';
    html += '<button class="btn primary'+(isSv?' saved':'')+'" id="sheetSave">'+starIcon(isSv)+(isSv?'Saved to My Plan':'Add to My Plan')+'</button>';
    html += '</div>';
  }

  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('scrim').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  wireSheet();
  if(!skipFocus) focusSheet();
}
function focusSheet(){
  var el = document.getElementById('sheetClose');
  if(el) el.focus({preventScroll:true});
}
function closeSheet(){
  state.sheetId = null;
  state.sheetStack = [];
  document.getElementById('scrim').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  if(lastFocusedTrigger && document.contains(lastFocusedTrigger)){
    lastFocusedTrigger.focus({preventScroll:true});
  }
  lastFocusedTrigger = null;
}

function wireSheet(){
  var close = document.getElementById('sheetClose');
  if(close) close.addEventListener('click', closeSheet);
  var saveBtn = document.getElementById('sheetSave');
  if(saveBtn) saveBtn.addEventListener('click', function(){ toggleSaved(state.sheetId); });
  document.querySelectorAll('#sheetContent [data-back]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.stopPropagation(); goBack(); });
  });
  document.querySelectorAll('#sheetContent [data-open]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      state.sheetStack.push(currentSheetDescriptor());
      openSheet(el.getAttribute('data-open'));
    });
  });
  document.querySelectorAll('#sheetContent [data-save]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      toggleSaved(el.getAttribute('data-save'));
    });
  });
  document.querySelectorAll('#sheetContent [data-open-speaker]').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      state.sheetStack.push(currentSheetDescriptor());
      openSpeakerSheet(el.getAttribute('data-open-speaker'));
    });
  });
  var copyBtn = document.getElementById('copyLink');
  if(copyBtn){
    copyBtn.addEventListener('click', function(){
      var input = document.getElementById('shareUrlInput');
      var fallbackCopy = function(){
        input.removeAttribute('readonly');
        input.select(); input.setSelectionRange(0,99999);
        try{ document.execCommand('copy'); }catch(err){}
        input.setAttribute('readonly','');
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(input.value).then(function(){ showToast('Link copied'); }).catch(function(){ fallbackCopy(); showToast('Link copied'); });
      } else {
        fallbackCopy();
        showToast('Link copied');
      }
    });
  }
}

/* ============================= MAIN RENDER ============================= */

function render(){
  var main = document.getElementById('main');
  if(state.view === 'schedule') main.innerHTML = renderSchedule();
  else if(state.view === 'map') main.innerHTML = renderMap();
  else if(state.view === 'plan') main.innerHTML = renderPlan();
  else if(state.view === 'speakers') main.innerHTML = renderSpeakers();
  else if(state.view === 'info') main.innerHTML = renderInfo();

  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-view') === state.view);
  });
  var pc = document.getElementById('planCount');
  pc.textContent = saved.length ? '('+saved.length+')' : '';

  wireMain();
}

function wireMain(){
  document.querySelectorAll('[data-day]').forEach(function(b){
    b.addEventListener('click', function(){ state.day = parseInt(b.getAttribute('data-day'),10); render(); });
  });
  document.querySelectorAll('[data-cat]').forEach(function(b){
    b.addEventListener('click', function(){ state.cat = b.getAttribute('data-cat'); render(); });
  });
  var search = document.getElementById('searchInput');
  if(search){
    search.addEventListener('input', function(){ state.query = search.value; render(); search.focus(); search.setSelectionRange(search.value.length, search.value.length); });
  }
  var searchClear = document.getElementById('searchClear');
  if(searchClear) searchClear.addEventListener('click', function(){ state.query=''; render(); var s=document.getElementById('searchInput'); if(s) s.focus(); });
  var clearBtn = document.getElementById('clearFilters');
  if(clearBtn) clearBtn.addEventListener('click', function(){ state.cat='all'; state.query=''; render(); });
  var goOtherDay = document.getElementById('goOtherDay');
  if(goOtherDay) goOtherDay.addEventListener('click', function(){ state.day = parseInt(goOtherDay.getAttribute('data-goday'),10); render(); });
  var jumpNow = document.getElementById('jumpNow');
  if(jumpNow) jumpNow.addEventListener('click', function(){
    var n = nowInfo();
    if(!n) return;
    state.day = n.day; state.cat = 'all'; state.query = '';
    render();
    var row = document.getElementById('liveRow');
    if(row) row.scrollIntoView({behavior:'smooth', block:'center'});
  });
  var goSched = document.getElementById('goSchedule');
  if(goSched) goSched.addEventListener('click', function(){ state.view='schedule'; render(); });
  var shareBtn = document.getElementById('sharePlan');
  if(shareBtn) shareBtn.addEventListener('click', function(){
    lastFocusedTrigger = shareBtn;
    state.sheetStack = [];
    openShareSheet();
  });

  document.querySelectorAll('[data-open]').forEach(function(el){
    el.addEventListener('click', function(){
      lastFocusedTrigger = el;
      state.sheetStack = [];
      openSheet(el.getAttribute('data-open'));
    });
  });
  document.querySelectorAll('[data-save]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.stopPropagation(); toggleSaved(el.getAttribute('data-save')); });
  });
  document.querySelectorAll('[data-open-speaker]').forEach(function(el){
    el.addEventListener('click', function(){
      lastFocusedTrigger = el;
      state.sheetStack = [];
      openSpeakerSheet(el.getAttribute('data-open-speaker'));
    });
  });
}

document.getElementById('tabs').addEventListener('click', function(ev){
  var btn = ev.target.closest('button[data-view]');
  if(!btn) return;
  state.view = btn.getAttribute('data-view');
  render();
});
document.getElementById('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape' && document.getElementById('sheet').classList.contains('show')){
    closeSheet();
  }
});

render();
checkIncomingPlan();

})();
</script>

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
